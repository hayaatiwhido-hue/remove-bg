<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removedor HD eSports</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            color: var(--text);
            margin-bottom: 0.25rem;
            background: linear-gradient(to right, #c084fc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
        }

        .token-card {
            background: rgba(0, 0, 0, 0.25);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .token-row {
            display: flex;
            gap: 0.5rem;
        }

        .btn-save-token {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.2s;
        }

        .btn-save-token:hover {
            background: var(--primary-hover);
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
            width: 100%;
        }

        .file-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        #fileInput { display: none; }

        .progress-box {
            margin-top: 1.2rem;
            display: none;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .result-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 1;
            background-image: 
                linear-gradient(45deg, #2d3748 25%, transparent 25%), 
                linear-gradient(-45deg, #2d3748 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2d3748 75%), 
                linear-gradient(-45deg, transparent 75%, #2d3748 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #1a202c;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .file-name {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            text-align: center;
            word-break: break-all;
        }

        .btn-download-all {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.2rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Removedor HD eSports</h1>
        <p class="subtitle">Recorte Nível PhotoRoom (Camisas Brancas e Placas)</p>

        <!-- Seção Chave API -->
        <div class="token-card">
            <label for="hfToken">CHAVE API HUGGING FACE (HF TOKEN)</label>
            <div class="token-row">
                <input type="password" id="hfToken" placeholder="Cole sua chave hf_... aqui">
                <button type="button" class="btn-save-token" id="btnSaveToken">Salvar Chave</button>
            </div>
        </div>

        <div class="grid-inputs">
            <div class="form-group">
                <label>LARGURA (PX)</label>
                <input type="number" id="canvasWidth" value="1500">
            </div>

            <div class="form-group">
                <label>ALTURA (PX)</label>
                <input type="number" id="canvasHeight" value="1500">
            </div>
        </div>

        <label for="fileInput" class="file-upload-btn">
            📂 ESCOLHER FOTOS DOS JOGADORES
        </label>
        <input type="file" id="fileInput" multiple accept="image/*">

        <div class="progress-box" id="progressBox">
            <div class="progress-text">
                <span id="statusText">Iniciando...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="results-grid" id="resultsGrid"></div>

        <button class="btn-download-all" id="btnDownloadAll">⚡ Baixar Fotos Recortadas (.ZIP)</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const progressBox = document.getElementById('progressBox');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const progressPercent = document.getElementById('progressPercent');
        const resultsGrid = document.getElementById('resultsGrid');
        const btnDownloadAll = document.getElementById('btnDownloadAll');
        const canvasWidthInput = document.getElementById('canvasWidth');
        const canvasHeightInput = document.getElementById('canvasHeight');
        
        const hfTokenInput = document.getElementById('hfToken');
        const btnSaveToken = document.getElementById('btnSaveToken');

        // Carrega a chave salva
        const savedToken = localStorage.getItem('hf_token_bg');
        if (savedToken) {
            hfTokenInput.value = savedToken;
        }

        // Salvar chave com confirmação
        btnSaveToken.addEventListener('click', () => {
            const tokenValue = hfTokenInput.value.trim();
            if (tokenValue.length > 0) {
                localStorage.setItem('hf_token_bg', tokenValue);
                alert("✅ Chave API salva com sucesso neste navegador!");
            } else {
                localStorage.removeItem('hf_token_bg');
                alert("⚠️ O campo da chave estava vazio. A chave salva foi removida.");
            }
        });

        let processedImages = [];

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            const token = hfTokenInput.value.trim();
            if (!token) {
                alert("Por favor, cole sua chave API e clique em 'Salvar Chave' antes de enviar as fotos.");
                return;
            }

            resultsGrid.innerHTML = '';
            processedImages = [];
            btnDownloadAll.style.display = 'none';
            progressBox.style.display = 'block';

            const targetW = parseInt(canvasWidthInput.value) || 1500;
            const targetH = parseInt(canvasHeightInput.value) || 1500;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusText.innerText = `Processando jogador ${i + 1} de ${files.length}...`;
                updateProgress((i / files.length) * 100);

                try {
                    const optimizedBlob = await prepareImageBlob(file);

                    // Utiliza proxy de cabeçalho para evitar o erro Failed to fetch (CORS)
                    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent("https://api-inference.huggingface.co/models/briaai/RMBG-1.4");

                    const response = await fetch(proxyUrl, {
                        headers: {
                            "Authorization": `Bearer ${token}`,
                            "Content-Type": "application/octet-stream"
                        },
                        method: "POST",
                        body: optimizedBlob
                    });

                    if (!response.ok) {
                        if (response.status === 503) {
                            statusText.innerText = "Aguardando servidor de IA aquecer (5s)...";
                            await new Promise(r => setTimeout(r, 5000));
                            i--; 
                            continue;
                        }
                        const errText = await response.text();
                        throw new Error(`Erro API (${response.status}): ${errText}`);
                    }

                    const noBgBlob = await response.blob();
                    const finalBlob = await resizeToCanvas(noBgBlob, targetW, targetH);

                    processedImages.push({
                        name: file.name.replace(/\.[^/.]+$/, "") + "_no_bg.png",
                        blob: finalBlob
                    });

                    renderPreview(finalBlob, file.name);
                    updateProgress(((i + 1) / files.length) * 100);
                } catch (error) {
                    console.error("Erro no envio:", error);
                    alert(`Não foi possível recortar o jogador ${file.name}.\nMotivo: ${error.message}`);
                }
            }

            statusText.innerText = "Recortes Concluídos!";
            btnDownloadAll.style.display = 'block';
        });

        function updateProgress(percent) {
            const p = Math.round(percent);
            progressBar.style.width = p + '%';
            progressPercent.innerText = p + '%';
        }

        function prepareImageBlob(file) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const maxDim = 1000;
                    let w = img.width;
                    let h = img.height;

                    if (w > maxDim || h > maxDim) {
                        if (w > h) {
                            h = Math.round((h * maxDim) / w);
                            w = maxDim;
                        } else {
                            w = Math.round((w * maxDim) / h);
                            h = maxDim;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = w;
                    canvas.height = h;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, w, h);

                    canvas.toBlob((blob) => resolve(blob), 'image/jpeg', 0.85);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        function resizeToCanvas(blob, targetW, targetH) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = targetW;
                    canvas.height = targetH;
                    const ctx = canvas.getContext('2d');

                    const scale = Math.min(targetW / img.width, targetH / img.height);
                    const x = (targetW / 2) - (img.width / 2) * scale;
                    const y = (targetH / 2) - (img.height / 2) * scale;

                    ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
                    canvas.toBlob((res) => resolve(res), 'image/png');
                };
                img.src = URL.createObjectURL(blob);
            });
        }

        function renderPreview(blob, filename) {
            const card = document.createElement('div');
            card.className = 'result-card';

            const box = document.createElement('div');
            box.className = 'preview-box';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(blob);

            const label = document.createElement('div');
            label.className = 'file-name';
            label.innerText = filename;

            box.appendChild(img);
            card.appendChild(box);
            card.appendChild(label);
            resultsGrid.appendChild(card);
        }

        btnDownloadAll.addEventListener('click', async () => {
            const zip = new JSZip();
            processedImages.forEach(img => {
                zip.file(img.name, img.blob);
            });

            const content = await zip.generateAsync({ type: "blob" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = "jogadores_recortados.zip";
            a.click();
        });
    </script>
</body>
</html>
