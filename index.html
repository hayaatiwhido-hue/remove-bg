<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removedor HD eSports</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.4rem;
            text-align: center;
            color: var(--text);
            margin-bottom: 0.25rem;
            background: linear-gradient(to right, #c084fc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 1.2rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 0.8rem;
            border-radius: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
        }

        input {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem;
            border-radius: 8px;
            font-size: 0.85rem;
            outline: none;
        }

        .file-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
        }

        #fileInput { display: none; }

        .progress-box {
            margin-top: 1.2rem;
            display: none;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-top: 1.2rem;
        }

        .result-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 1;
            background-image: 
                linear-gradient(45deg, #2d3748 25%, transparent 25%), 
                linear-gradient(-45deg, #2d3748 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2d3748 75%), 
                linear-gradient(-45deg, transparent 75%, #2d3748 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #1a202c;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .file-name {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            text-align: center;
            word-break: break-all;
        }

        .btn-download-all {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.2rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Removedor HD eSports</h1>
        <p class="subtitle">Recorte seguro para uniformes claros e placas</p>

        <div class="grid-inputs">
            <div class="form-group">
                <label>Largura (px)</label>
                <input type="number" id="canvasWidth" value="1500">
            </div>

            <div class="form-group">
                <label>Altura (px)</label>
                <input type="number" id="canvasHeight" value="1500">
            </div>
        </div>

        <label for="fileInput" class="file-upload-btn">
            📂 Escolher fotos dos Jogadores
        </label>
        <input type="file" id="fileInput" multiple accept="image/*">

        <div class="progress-box" id="progressBox">
            <div class="progress-text">
                <span id="statusText">Processando...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="results-grid" id="resultsGrid"></div>

        <button class="btn-download-all" id="btnDownloadAll">⚡ Baixar Fotos Recortadas (.ZIP)</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const progressBox = document.getElementById('progressBox');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const progressPercent = document.getElementById('progressPercent');
        const resultsGrid = document.getElementById('resultsGrid');
        const btnDownloadAll = document.getElementById('btnDownloadAll');
        const canvasWidthInput = document.getElementById('canvasWidth');
        const canvasHeightInput = document.getElementById('canvasHeight');

        let processedImages = [];

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            resultsGrid.innerHTML = '';
            processedImages = [];
            btnDownloadAll.style.display = 'none';
            progressBox.style.display = 'block';

            const targetW = parseInt(canvasWidthInput.value) || 1500;
            const targetH = parseInt(canvasHeightInput.value) || 1500;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusText.innerText = `Recortando jogador ${i + 1} de ${files.length}...`;
                updateProgress(((i + 0.1) / files.length) * 100);

                try {
                    const img = await loadImage(file);
                    const finalBlob = processSmartRemoval(img, targetW, targetH);

                    processedImages.push({
                        name: file.name.replace(/\.[^/.]+$/, "") + "_no_bg.png",
                        blob: finalBlob
                    });

                    renderPreview(finalBlob, file.name);
                    updateProgress(((i + 1) / files.length) * 100);
                } catch (error) {
                    console.error("Erro na imagem:", file.name, error);
                }
            }

            statusText.innerText = "Processamento Concluído!";
            btnDownloadAll.style.display = 'block';
        });

        function updateProgress(percent) {
            const p = Math.round(percent);
            progressBar.style.width = p + '%';
            progressPercent.innerText = p + '%';
        }

        function loadImage(file) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.onerror = reject;
                img.src = URL.createObjectURL(file);
            });
        }

        function processSmartRemoval(img, targetW, targetH) {
            const w = img.width;
            const h = img.height;

            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const ctx = tempCanvas.getContext('2d');
            ctx.drawImage(img, 0, 0);

            const imgData = ctx.getImageData(0, 0, w, h);
            const data = imgData.data;

            // 1. Amostragem da cor de fundo nos 4 cantos
            const samples = [
                0, // Canto superior esquerdo
                (w - 1) * 4, // Canto superior direito
                ((h - 1) * w) * 4, // Canto inferior esquerdo
                ((h - 1) * w + (w - 1)) * 4 // Canto inferior direito
            ];

            let bgR = 0, bgG = 0, bgB = 0;
            samples.forEach(idx => {
                bgR += data[idx];
                bgG += data[idx + 1];
                bgB += data[idx + 2];
            });
            bgR /= samples.length;
            bgG /= samples.length;
            bgB /= samples.length;

            // 2. Flood fill a partir de todas as bordas externas (preserva o interior 100%)
            const visited = new Uint8Array(w * h);
            const queue = [];

            for (let x = 0; x < w; x++) {
                queue.push(x, 0);
                queue.push(x, h - 1);
            }
            for (let y = 0; y < h; y++) {
                queue.push(0, y);
                queue.push(w - 1, y);
            }

            const threshold = 40; // Tolerância para capturar sombras leves do estúdio
            let qHead = 0;

            while (qHead < queue.length) {
                const x = queue[qHead++];
                const y = queue[qHead++];
                const pos = y * w + x;

                if (visited[pos]) continue;

                const idx = pos * 4;
                const r = data[idx];
                const g = data[idx + 1];
                const b = data[idx + 2];

                // Distância da cor do fundo
                const dist = Math.sqrt((r - bgR) ** 2 + (g - bgG) ** 2 + (b - bgB) ** 2);

                if (dist <= threshold) {
                    visited[pos] = 1;
                    data[idx + 3] = 0; // Transparente

                    // Expande para os vizinhos imediatos
                    if (x > 0 && !visited[pos - 1]) queue.push(x - 1, y);
                    if (x < w - 1 && !visited[pos + 1]) queue.push(x + 1, y);
                    if (y > 0 && !visited[pos - w]) queue.push(x, y - 1);
                    if (y < h - 1 && !visited[pos + w]) queue.push(x, y + 1);
                }
            }

            ctx.putImageData(imgData, 0, 0);

            // 3. Renderiza no canvas final 1500x1500px centralizado
            const finalCanvas = document.createElement('canvas');
            finalCanvas.width = targetW;
            finalCanvas.height = targetH;
            const finalCtx = finalCanvas.getContext('2d');

            const scale = Math.min(targetW / w, targetH / h);
            const destX = (targetW / 2) - (w / 2) * scale;
            const destY = (targetH / 2) - (h / 2) * scale;

            finalCtx.drawImage(tempCanvas, destX, destY, w * scale, h * scale);

            const dataUrl = finalCanvas.toDataURL('image/png');
            return dataURItoBlob(dataUrl);
        }

        function dataURItoBlob(dataURI) {
            const byteString = atob(dataURI.split(',')[1]);
            const mimeString = dataURI.split(',')[0].split(':')[1].split(';')[0];
            const ab = new ArrayBuffer(byteString.length);
            const ia = new Uint8Array(ab);
            for (let i = 0; i < byteString.length; i++) {
                ia[i] = byteString.charCodeAt(i);
            }
            return new Blob([ab], {type: mimeString});
        }

        function renderPreview(blob, filename) {
            const card = document.createElement('div');
            card.className = 'result-card';

            const box = document.createElement('div');
            box.className = 'preview-box';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(blob);

            const label = document.createElement('div');
            label.className = 'file-name';
            label.innerText = filename;

            box.appendChild(img);
            card.appendChild(box);
            card.appendChild(label);
            resultsGrid.appendChild(card);
        }

        btnDownloadAll.addEventListener('click', async () => {
            const zip = new JSZip();
            processedImages.forEach(img => {
                zip.file(img.name, img.blob);
            });

            const content = await zip.generateAsync({ type: "blob" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = "jogadores_recortados.zip";
            a.click();
        });
    </script>
</body>
</html>
