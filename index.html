<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Removedor de Fundo e Redimensionador eSports IA</title>
    <script src="https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.4.5/dist/index.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --bg: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1.5rem 1rem;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: var(--surface);
            border-radius: 16px;
            padding: 1.5rem;
            border: 1px solid var(--border);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--text);
            margin-bottom: 0.25rem;
            background: linear-gradient(to right, #c084fc, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 1.5rem;
        }

        .grid-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-bottom: 1rem;
            background: rgba(0, 0, 0, 0.2);
            padding: 1rem;
            border-radius: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-muted);
        }

        input, select {
            background: var(--bg);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.6rem 0.8rem;
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
        }

        .file-upload-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, var(--primary), #a855f7);
            color: white;
            padding: 0.9rem;
            border-radius: 10px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            text-align: center;
        }

        #fileInput {
            display: none;
        }

        .progress-box {
            margin-top: 1.5rem;
            display: none;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
            color: var(--text-muted);
        }

        .progress-bar-bg {
            width: 100%;
            height: 8px;
            background: var(--bg);
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        .results-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .result-card {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .preview-box {
            width: 100%;
            aspect-ratio: 1;
            background-image: 
                linear-gradient(45deg, #2d3748 25%, transparent 25%), 
                linear-gradient(-45deg, #2d3748 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #2d3748 75%), 
                linear-gradient(-45deg, transparent 75%, #2d3748 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            background-color: #1a202c;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .file-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.4rem;
            word-break: break-all;
            text-align: center;
        }

        .btn-download-all {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            margin-top: 1.5rem;
            display: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Removedor IA & Redimensionador</h1>
        <p class="subtitle">Recorte perfeito com Inteligência Artificial sem bordas duras</p>

        <div class="grid-inputs">
            <div class="form-group full-width">
                <label>Formato do Canvas</label>
                <select id="canvasPreset">
                    <option value="custom">Personalizado</option>
                    <option value="1500x1500" selected>1500 x 1500 px (Quadrado HD)</option>
                    <option value="1080x1080">1080 x 1080 px (Instagram Feed)</option>
                    <option value="1080x1920">1080 x 1920 px (Instagram Stories)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Largura (px)</label>
                <input type="number" id="canvasWidth" value="1500">
            </div>

            <div class="form-group">
                <label>Altura (px)</label>
                <input type="number" id="canvasHeight" value="1500">
            </div>
        </div>

        <label for="fileInput" class="file-upload-btn">
            📂 Escolher fotos dos Jogadores
        </label>
        <input type="file" id="fileInput" multiple accept="image/*">

        <div class="progress-box" id="progressBox">
            <div class="progress-text">
                <span id="statusText">Carregando Modelo de IA...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-bar-bg">
                <div class="progress-bar-fill" id="progressBar"></div>
            </div>
        </div>

        <div class="results-grid" id="resultsGrid"></div>

        <button class="btn-download-all" id="btnDownloadAll">⚡ Baixar Fotos Recortadas (.ZIP)</button>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const progressBox = document.getElementById('progressBox');
        const progressBar = document.getElementById('progressBar');
        const statusText = document.getElementById('statusText');
        const progressPercent = document.getElementById('progressPercent');
        const resultsGrid = document.getElementById('resultsGrid');
        const btnDownloadAll = document.getElementById('btnDownloadAll');
        const canvasPreset = document.getElementById('canvasPreset');
        const canvasWidthInput = document.getElementById('canvasWidth');
        const canvasHeightInput = document.getElementById('canvasHeight');

        let processedImages = [];

        canvasPreset.addEventListener('change', () => {
            const val = canvasPreset.value;
            if (val !== 'custom') {
                const [w, h] = val.split('x');
                canvasWidthInput.value = w;
                canvasHeightInput.value = h;
            }
        });

        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (!files.length) return;

            resultsGrid.innerHTML = '';
            processedImages = [];
            btnDownloadAll.style.display = 'none';
            progressBox.style.display = 'block';

            const targetW = parseInt(canvasWidthInput.value) || 1500;
            const targetH = parseInt(canvasHeightInput.value) || 1500;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                statusText.innerText = `Processando foto ${i + 1} de ${files.length} com IA...`;
                updateProgress(((i) / files.length) * 100);

                try {
                    // Remoção com IA
                    const blobOut = await imglyRemoveBackground(file, {
                        progress: (key, current, total) => {
                            if (key.includes('compute')) {
                                const subPercent = Math.round((current / total) * 100);
                                progressPercent.innerText = `${Math.round(((i + (subPercent/100)) / files.length) * 100)}%`;
                            }
                        }
                    });

                    // Redimensionamento no Canvas
                    const finalBlob = await resizeToCanvas(blobOut, targetW, targetH);
                    processedImages.push({
                        name: file.name.replace(/\.[^/.]+$/, "") + "_no_bg.png",
                        blob: finalBlob
                    });

                    renderPreview(finalBlob, file.name);

                } catch (err) {
                    console.error("Erro ao processar imagem:", err);
                    alert("Erro ao processar " + file.name);
                }
            }

            updateProgress(100);
            statusText.innerText = "Processamento com IA concluído!";
            if (processedImages.length > 0) {
                btnDownloadAll.style.display = 'block';
            }
        });

        function updateProgress(percent) {
            const p = Math.round(percent);
            progressBar.style.width = p + '%';
            progressPercent.innerText = p + '%';
        }

        function resizeToCanvas(blob, width, height) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;
                    const ctx = canvas.getContext('2d');

                    // Centralizar e manter a proporção
                    const scale = Math.min(width / img.width, height / img.height);
                    const x = (width / 2) - (img.width / 2) * scale;
                    const y = (height / 2) - (img.height / 2) * scale;

                    ctx.drawImage(img, x, y, img.width * scale, img.height * scale);

                    canvas.toBlob((b) => resolve(b), 'image/png');
                };
                img.src = URL.createObjectURL(blob);
            });
        }

        function renderPreview(blob, filename) {
            const card = document.createElement('div');
            card.className = 'result-card';

            const box = document.createElement('div');
            box.className = 'preview-box';

            const img = document.createElement('img');
            img.src = URL.createObjectURL(blob);

            const label = document.createElement('div');
            label.className = 'file-name';
            label.innerText = filename;

            box.appendChild(img);
            card.appendChild(box);
            card.appendChild(label);
            resultsGrid.appendChild(card);
        }

        btnDownloadAll.addEventListener('click', async () => {
            const zip = new JSZip();
            processedImages.forEach(img => {
                zip.file(img.name, img.blob);
            });

            const content = await zip.generateAsync({ type: "blob" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = "jogadores_sem_fundo.zip";
            a.click();
        });
    </script>
</body>
</html>
